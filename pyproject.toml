# pyproject.toml (CREAR)
[project]
name = "orion-deteccion-hurto-energia"
version = "1.0.0"
description = "Sistema de detección de hurto de energía"
requires-python = ">=3.10"
readme = "LEEME.md"
license = {text = "MIT"}

[project.dependencies]
numpy = ">=1.24.0,<2.0.0"
pandas = ">=2.0.0,<3.0.0"
scikit-learn = ">=1.3.0,<2.0.0"
xgboost = ">=2.0.0,<3.0.0"
lightgbm = ">=4.0.0,<5.0.0"
shap = ">=0.42.0,<1.0.0"
fastapi = ">=0.100.0,<1.0.0"
uvicorn = {version = ">=0.23.0,<1.0.0", extras = ["standard"]}
python-multipart = ">=0.0.6"
streamlit = ">=1.25.0,<2.0.0"
plotly = ">=5.17.0,<6.0.0"
gspread = ">=5.12.0,<6.0.0"
oauth2client = ">=4.1.3,<5.0.0"
python-dotenv = ">=1.0.0,<2.0.0"
pyyaml = ">=6.0,<7.0.0"
joblib = ">=1.3.0,<2.0.0"
loguru = ">=0.7.0,<1.0.0"
matplotlib = ">=3.7.0,<4.0.0"
seaborn = ">=0.12.0,<1.0.0"
jupyter = ">=1.0.0,<2.0.0"
ipykernel = ">=6.0.0,<7.0.0"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "black>=23.0.0,<24.0.0",
    "flake8>=6.0.0,<7.0.0",
    "mypy>=1.0.0,<2.0.0",
    "isort>=5.12.0,<6.0.0",
    "pre-commit>=3.0.0,<4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100