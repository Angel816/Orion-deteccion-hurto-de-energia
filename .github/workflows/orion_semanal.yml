# .github/workflows/orion_semanal.yml
# ============================================================
# PROYECTO ORION - REPORTE SEMANAL AUTOMÁTICO
# ============================================================
# Genera un reporte semanal con las métricas del sistema.
#
# Horario: Lunes 8:00 AM hora Perú (13:00 UTC)
# ============================================================

name: Orion Weekly Report

on:
  # ============================================================
  # EJECUCIÓN PROGRAMADA (CRON)
  # ============================================================
  schedule:
    # Lunes 8:00 AM hora Perú = 13:00 UTC
    - cron: '0 13 * * 6'
  
  # ============================================================
  # EJECUCIÓN MANUAL DESDE GITHUB
  # ============================================================
  workflow_dispatch:

jobs:
  # ============================================================
  # JOB PRINCIPAL: REPORTE SEMANAL
  # ============================================================
  reporte:
    name: 📊 Reporte Semanal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # ============================================================
      # PASO 1: CHECKOUT
      # ============================================================
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4
      
      # ============================================================
      # PASO 2: SETUP PYTHON
      # ============================================================
      - name: 🐍 Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      
      # ============================================================
      # PASO 3: INSTALAR DEPENDENCIAS
      # ============================================================
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # ============================================================
      # PASO 4: CONFIGURAR ENCODING
      # ============================================================
      - name: 🔧 Configurar encoding UTF-8
        run: |
          echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV
          echo "LANG=C.UTF-8" >> $GITHUB_ENV
      
      # ============================================================
      # PASO 5: VERIFICAR ESTRUCTURA
      # ============================================================
      - name: 📁 Verificar estructura
        run: |
          mkdir -p reportes
          mkdir -p registros
      
      # ============================================================
      # PASO 6: GENERAR REPORTE
      # ============================================================
      - name: 📊 Generar reporte semanal
        run: |
          echo "📊 Generando reporte semanal..."
          
          cat > reportes/reporte_semanal.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Orion - Reporte Semanal</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  h1 { color: #2c3e50; }
                  .metric { background: #ecf0f1; padding: 15px; margin: 10px 0; border-radius: 5px; }
                  .value { font-size: 24px; font-weight: bold; color: #3498db; }
                  .label { color: #7f8c8d; }
                  table { border-collapse: collapse; width: 100%; }
                  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                  th { background-color: #3498db; color: white; }
              </style>
          </head>
          <body>
              <h1>🌌 Orion - Reporte Semanal</h1>
              <p>Generado: $(TZ='America/Lima' date '+%Y-%m-%d %H:%M:%S') (Perú)</p>
              
              <h2>📊 Resumen del Sistema</h2>
              <div class="metric">
                  <div class="label">Estado</div>
                  <div class="value">✅ Operativo</div>
              </div>
              
              <h2>📈 Métricas</h2>
              <p>Consultar dashboard para métricas detalladas.</p>
              
              <hr>
              <p><em>Reporte generado automáticamente por Orion</em></p>
          </body>
          </html>
          EOF
          
          echo "✅ Reporte generado"
      
      # ============================================================
      # PASO 7: SUBIR REPORTE
      # ============================================================
      - name: 📤 Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-semanal
          path: reportes/
          retention-days: 30
          if-no-files-found: warn
      
      # ============================================================
      # PASO 8: NOTIFICAR
      # ============================================================
      - name: ✅ Notificar éxito
        if: success()
        run: |
          echo "=========================================="
          echo "✅ REPORTE SEMANAL COMPLETADO"
          echo "=========================================="
          echo "🕐 Hora Perú: $(TZ='America/Lima' date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="