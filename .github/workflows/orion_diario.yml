# .github/workflows/orion_diario.yml
name: Orion Daily Pipeline

on:
  schedule:
    - cron: '0 6 * * *'   # 6:00 AM diario
  workflow_dispatch:       # Ejecución manual

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run daily pipeline
        run: python scripts/ejecutar_tuberia_diaria.py
        timeout-minutes: 30
      
      - name: Run closed loop
        run: python scripts/ejecutar_bucle_cerrado.py
        timeout-minutes: 15
      
      - name: Upload inspection list
        uses: actions/upload-artifact@v3
        with:
          name: inspection-list
          path: datos/procesados/inspecciones_priorizadas_*.csv
          retention-days: 7
      
      - name: Upload metrics
        uses: actions/upload-artifact@v3
        with:
          name: model-metrics
          path: modelos/actual/metrics.json
          retention-days: 30

      - name: Verify data availability
        run: |
            python -c "
            from pathlib import Path
            import sys
            sys.path.append('.')
            from src.datos.cargador import CargadorIncremental
            cargador = CargadorIncremental()
            consumo = cargador.verificar_disponibilidad('consumo')
            if not consumo['disponible']:
                print('❌ No hay datos de consumo disponibles')
                print(f'   {consumo["mensaje"]}')
                sys.exit(1)
            print('✅ Datos disponibles')
            "